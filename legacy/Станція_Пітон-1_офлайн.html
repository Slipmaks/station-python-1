      <pre aria-hidden="true"><code></code></pre>
      <textarea spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Редактор коду Python"></textarea>
      <span class="ed-hint">Tab — відступ · Ctrl+Enter — запуск</span>
    </div></div>`);
  container.append(ed);
  const ta = ed.querySelector('textarea'), pre = ed.querySelector('pre'), code = ed.querySelector('code'), gut = ed.querySelector('.gutter');
  let escaped = false;
  const paint = () => {
    code.innerHTML = highlight(ta.value);
    const n = ta.value.split('\n').length;
    if (gut.childElementCount !== n) gut.innerHTML = Array.from({ length: n }, (_, i) => `<div>${i + 1}</div>`).join('');
    sync();
  };
  const sync = () => { pre.scrollTop = ta.scrollTop; pre.scrollLeft = ta.scrollLeft; gut.scrollTop = ta.scrollTop; };
  const insert = (text) => {
    ta.focus();
    if (!document.execCommand || !document.execCommand(text === '' ? 'delete' : 'insertText', false, text)) {
      const s = ta.selectionStart, e = ta.selectionEnd;
      ta.value = ta.value.slice(0, s) + text + ta.value.slice(e);
      ta.selectionStart = ta.selectionEnd = s + text.length;
      ta.dispatchEvent(new Event('input'));
    }
  };
  ta.value = value || '';
  ta.addEventListener('input', () => { paint(); onChange && onChange(ta.value); });
  ta.addEventListener('scroll', sync);
  ta.addEventListener('keydown', e => {
    if ((e.key === 'Enter' && (e.ctrlKey || e.metaKey)) || e.key === 'F5') { e.preventDefault(); onRun && onRun(); return; }
    if (e.key === 'Escape') { escaped = true; return; }
    if (e.key === 'Tab') {
      if (escaped) { escaped = false; return; }
      e.preventDefault();
      const s = ta.selectionStart, en = ta.selectionEnd, v = ta.value;
      const ls = v.lastIndexOf('\n', s - 1) + 1;
      if (s !== en && v.slice(s, en).includes('\n') || e.shiftKey) {
        const le = v.indexOf('\n', en - (en > s && v[en - 1] === '\n' ? 1 : 0)); const lend = le < 0 ? v.length : le;
        const block = v.slice(ls, lend);
        const nb = e.shiftKey ? block.replace(/^ {1,4}/gm, '') : block.replace(/^/gm, '    ');
        ta.setSelectionRange(ls, lend); insert(nb); ta.setSelectionRange(ls, ls + nb.length);
      } else insert('    ');
      return;
    }
    escaped = false;
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      const s = ta.selectionStart, v = ta.value;
      const ls = v.lastIndexOf('\n', s - 1) + 1;
      const line = v.slice(ls, s);
      let ind = (/^ */.exec(line) || [''])[0];
      if (/:\s*(#.*)?$/.test(line)) ind += '    ';
      insert('\n' + ind);
      return;
    }
    if (e.key === 'Backspace' && ta.selectionStart === ta.selectionEnd) {
      const s = ta.selectionStart, v = ta.value; const ls = v.lastIndexOf('\n', s - 1) + 1;
      const before = v.slice(ls, s);
      if (before.length >= 4 && /^ +$/.test(before) && before.length % 4 === 0) { e.preventDefault(); ta.setSelectionRange(s - 4, s); insert(''); }
    }
  });
  paint();
  return { ta, get value() { return ta.value; }, set value(v) { ta.value = v; paint(); onChange && onChange(v); }, focus: () => ta.focus() };
}

/* ===== Консоль ===== */
function explainError(e, events, src) {
  if (!e) {
    const sh = events && events.find(x => x.type === 'shadow');
    return sh ? `<b>Увага</b>Значення покладено у змінну з ім’ям <code>${esc(sh.name)}</code> — так звуть вбудовану команду, і тепер вона не працює. Обери інше ім’я змінної.` : '';
  }
  const m = e.msg, t = e.type;
  const code = e.code || '';
  if (t === 'NameError') {
    const name = (/name '([^']+)'/.exec(m) || [])[1] || '';
    const dym = (/Did you mean: '([^']+)'/.exec(m) || [])[1];
    if (dym && dym.toLowerCase() === name.toLowerCase()) return `<b>Python не знає імені «${esc(name)}»</b>Великі й малі літери в Python різні. Команду треба писати так: <code>${esc(dym)}</code>.`;
    if (dym) return `<b>Python не знає імені «${esc(name)}»</b>Можливо, тут помилка в написанні і мало бути <code>${esc(dym)}</code>.`;
    return `<b>Python не знає імені «${esc(name)}»</b>Якщо це текст — візьми його в лапки: <code>'${esc(name)}'</code>. Якщо це змінна — перевір, що її створено вище і що ім’я написано так само.`;
  }
  if (t === 'SyntaxError') {
    if (m.startsWith('unterminated string')) {
      if (/\p{L}'\p{L}/u.test(code)) return '<b>Лапки не закрито</b>Схоже, в тексті є апостроф (як у слові «зв’язок»): він закриває рядок раніше, ніж треба. Візьми такий текст у подвійні лапки: <code>"зв\'язок"</code>.';
      return '<b>Лапки не закрито</b>Текст має починатися й закінчуватися однаковими лапками: <code>\'...\'</code> або <code>"..."</code>.';
    }
    if (m.startsWith('invalid character')) return '<b>Незвичний символ</b>Python розуміє лише прямі лапки <code>\'</code> або <code>"</code>. «Ялинки» чи «криві» лапки з’являються, якщо ввімкнено українську розкладку або текст скопійовано з документа. Перемкни розкладку на англійську.';
    if (m.includes('was never closed')) return '<b>Дужку не закрито</b>Кожна відкрита дужка <code>(</code> має свою пару <code>)</code>. Порахуй дужки в рядку.';
    if (m.startsWith('unmatched') || m.startsWith('closing parenthesis')) return '<b>Зайва дужка</b>Закривних дужок більше, ніж відкривних, або вони не до пари.';
    if (m === "expected ':'") return '<b>Бракує двокрапки</b>Заголовок циклу <code>for</code> (а також <code>if</code>) закінчується двокрапкою <code>:</code>.';
    if (m.includes('forgot a comma')) return '<b>Бракує коми</b>Схоже, між значеннями в дужках бракує коми.';
    if (m.includes("cannot assign")) return '<b>Неправильне присвоєння</b>Ліворуч від <code>=</code> має стояти ім’я змінної, а праворуч — значення.';
    if (m.includes("'==' or ':='")) return '<b>= замість ==</b>Для порівняння в умовах пишуть <code>==</code>.';
    if (m.includes('decimal literal')) return '<b>Ім’я не може починатися з цифри</b>Імена змінних починаються з літери або _: <code>x1</code>, а не <code>1x</code>.';
    return '<b>Порушено правила запису</b>Python не розуміє цей рядок. Перевір дужки, лапки, коми й двокрапки.';
  }
  if (t === 'IndentationError') {
    if (m.startsWith('expected an indented block')) return '<b>Потрібен відступ</b>Команди всередині циклу пишуть з відступом 4 пробіли (клавіша Tab). Саме відступ показує, що команда належить циклу.';
    if (m === 'unexpected indent') return '<b>Зайвий відступ</b>Цей рядок починається з пробілів, хоча не належить жодному циклу. Прибери пробіли на початку рядка.';
    return '<b>Відступи не збігаються</b>Рядки одного блоку мають мати однаковий відступ — 4 пробіли.';
  }
  if (t === 'TypeError') {
    if (m.startsWith('can only concatenate str')) return '<b>Текст + число не додаються</b>Значення ліворуч від <code>+</code> — рядок (текст). Якщо воно прийшло з <code>input()</code>, перетвори його на число: <code>int(...)</code>.';
    if (m.startsWith('unsupported operand') && m.includes("'str'")) return '<b>Число і текст не поєднуються</b>Один з доданків — рядок (текст). Перетвори його на число за допомогою <code>int()</code> або <code>float()</code>.';
    if (m.includes('not callable')) return '<b>Це не команда</b>Дужки після імені означають виклик команди, а тут стоїть звичайне значення. Можливо, змінну названо так само, як команду.';
    if (m.includes("can't multiply sequence")) return '<b>Текст можна множити лише на ціле число</b>Наприклад, <code>\'ха\' * 3</code> → хахаха.';
    return '<b>Неправильний тип даних</b>Ця дія не підходить для такого типу значення. Перевір, де число, а де текст.';
  }
  if (t === 'ValueError') {
    if (m.startsWith('invalid literal for int()')) return '<b>Це не ціле число</b><code>int()</code> не може перетворити такий текст на ціле число. Потрібні лише цифри — без пробілів, коми, крапки чи букв.';
    if (m.startsWith('could not convert string to float')) return '<b>Це не число</b><code>float()</code> не може перетворити такий текст на число. Дробову частину відділяй крапкою: 3.5.';
    return '';
  }
  if (t === 'ZeroDivisionError') return '<b>Ділення на нуль</b>На нуль ділити не можна — навіть Python’у.';
  if (t === 'IndexError') return '<b>Такого номера немає</b>Нумерація починається з 0, а останній номер на 1 менший за довжину.';
  return '';
}
function renderConsole(el, res, opts = {}) {
  el.innerHTML = '';
  if (opts.note) el.append(h(`<div class="sys">${esc(opts.note)}</div>`));
  for (const seg of res.out) {
    const sp = document.createElement('span');
    sp.className = seg.kind === 'in' ? 'in' : '';
    sp.textContent = seg.text;
    el.append(sp);
  }
  if (res.error) {
    const sp = document.createElement('span'); sp.className = 'err';
    const txt = Py.formatError(res.error);
    const prev = Py.outputText(res);
    sp.textContent = (prev && !prev.endsWith('\n') ? '\n' : '') + txt;
    el.append(sp);
  }
  const ex = explainError(res.error, res.events, opts.src);
  if (ex) el.append(h(`<div class="explain">${ex}</div>`));
  if (res.events && res.events.some(e => e.type === 'antigravity')) {
    el.append(h(`<div class="sys">Злітаємо! Справжній Python відкрив би комікс xkcd про те, як Python допоміг полетіти: <a href="https://xkcd.com/353/" target="_blank" rel="noopener" style="color:var(--c-kw)">xkcd.com/353</a></div>`));
  }
  if (!res.out.length && !res.error && !res.needInput && !opts.quietEmpty) el.append(h('<span class="sys">Програма виконалась, але нічого не вивела.</span>'));
  el.scrollTop = el.scrollHeight;
}

/* ===== Екран місії (код) ===== */
function crumbs(i) {
  const m = MISSIONS[i];
  return h(`<div class="crumbs"><a class="back" href="#/"><span aria-hidden="true">‹</span> До станції</a><span class="where">Відсік ${i + 1} з ${MISSIONS.length}</span></div>`);
}
function briefHead(i) {
  const m = MISSIONS[i];
  return `<h1>${esc(m.name)}</h1>
    <div class="tags"><span class="tag">${esc(m.topic)}</span><span class="tag slide">Слайд ${m.slide}</span></div>
    <p class="story">${m.story}</p>`;
}
function renderMission(i) {
  const m = MISSIONS[i];
  app.innerHTML = '';
  app.append(crumbs(i));
  if (m.kind === 'choice') return renderChoice(i);
  if (m.kind === 'types') return renderTypes(i);
  renderCode(i);
}
function expectedHTML(exp) {
  if (Array.isArray(exp)) return exp.map(([t, k]) => `<span class="${k === 'in' ? 'in' : ''}">${esc(t)}</span>`).join('');
  return esc(exp);
}
function renderCode(i) {
  const m = MISSIONS[i];
  const p = prog(m.id);
  const steps = m.steps;
  let stepIdx = steps ? Math.min(S.step[m.id] || 0, steps.length - 1) : 0;
  const cur = () => steps ? Object.assign({}, m, steps[stepIdx], {
    checks: [{ label: 'Програма працює без помилок', fn: c => !c.res.error }, { label: 'Результат правильний', fn: outIs(steps[stepIdx].expected), diff: steps[stepIdx].expected }],
    hints: [steps[stepIdx].hint],
  }) : m;
  const codeKey = () => steps ? m.id + ':' + stepIdx : m.id;

  const wrap = h(`<div class="mission"><section class="brief"></section><section class="ide-col"></section></div>`);
  app.append(wrap);
  const brief = wrap.querySelector('.brief'), col = wrap.querySelector('.ide-col');

  const ide = h(`<div class="ide">
    <div class="ide-bar"><div class="dots"><i></i><i></i><i></i></div><span class="ide-title">main.py</span>
      <div class="ide-actions"><button class="ghost" type="button" data-act="reset">Почати спочатку</button><button class="run" type="button" data-act="run">Запустити <kbd>F5</kbd></button></div></div>
    <div class="ed-slot"></div>
    <div class="console-head"><span>Оболонка — результат програми</span></div>
    <div class="console" aria-live="polite"><span class="placeholder">Натисни «Запустити», щоб виконати програму.</span></div>
  </div>`);
  col.append(ide);
  const consoleEl = ide.querySelector('.console');
  let editor;

  function drawBrief(checkState, verdict) {
    const c = cur();
    const stepBar = steps ? `<div class="block"><h3>Програма ${stepIdx + 1} з ${steps.length}</h3><div class="qdots">${steps.map((_, k) => `<i class="${k < stepIdx ? 'ok' : k === stepIdx ? 'cur' : ''}"></i>`).join('')}</div></div>` : '';
    const checks = [...c.checks.map(x => x.label), ...(c.tests && c.tests.length > 1 ? [c.otherDataLabel] : [])];
    const st = checkState || [];
    const hintsShown = steps ? (p['h' + stepIdx] || 0) : p.hints;
    const hintsHTML = c.hints.map((t, k) => k < hintsShown ? `<div class="hint-text">${t}</div>` : '').join('');
    const canHint = hintsShown < c.hints.length;
    const fails = steps ? (p['f' + stepIdx] || 0) : p.fails;
    const showSol = fails >= 3 || hintsShown >= c.hints.length;
    brief.innerHTML = `${briefHead(i)}${stepBar}
      <div class="block"><h3>Завдання</h3><div class="task">${c.task}</div></div>
      <div class="block"><h3>Очікуваний результат</h3><pre class="expected">${expectedHTML(c.expected)}</pre>${c.inputsNote ? `<div class="inputs-note">${c.inputsNote}</div>` : ''}</div>
      <div class="block"><h3>Перевірки</h3><ul class="checks">${checks.map((l, k) => `<li class="${st[k] === true ? 'ok' : st[k] === false ? 'fail' : ''}">${esc(l)}</li>`).join('')}</ul>${verdict || ''}</div>
      <div class="block hints"><h3>Підказки</h3>${hintsHTML}
        ${canHint ? `<button class="hint-btn" type="button" data-act="hint">${hintsShown ? 'Ще одна підказка' : 'Показати підказку'}</button>` : ''}
        ${showSol ? `<button class="sol-btn" type="button" data-act="sol">Показати розв’язок (залишиться 1 зірка)</button>` : ''}
      </div>`;
    brief.querySelector('[data-act="hint"]')?.addEventListener('click', () => {
      if (steps) p['h' + stepIdx] = (p['h' + stepIdx] || 0) + 1; else p.hints++;
      p.usedHint = true; save(); drawBrief(checkState, verdict);
    });
    brief.querySelector('[data-act="sol"]')?.addEventListener('click', () => {
      p.sol = true; save();
      editor.value = c.solution + '\n';
      toast('Розв’язок вставлено в редактор. Розберись, як він працює, і натисни «Запустити».');
      drawBrief(checkState, verdict);
    });
  }

  function mountEditor() {
    const slot = ide.querySelector('.ed-slot'); slot.innerHTML = '';
    const c = cur();
    const saved = S.code[codeKey()];
    editor = makeEditor(slot, saved !== undefined ? saved : c.starter, v => { S.code[codeKey()] = v; save(); }, runIt);
    consoleEl.innerHTML = '<span class="placeholder">Натисни «Запустити», щоб виконати програму.</span>';
    drawBrief();
  }

  function evalChecks(c, src, res, inputs) {
    const ctx = { src, res, out: norm(Py.outputText(res)), inputs: inputs || [] };
    return c.checks.map(x => { try { return !!x.fn(ctx); } catch (e) { return false; } });
  }

  function runIt() {
    const c = cur();
    const src = editor.value;
    const tests = c.tests || [{ inputs: [] }];
    const res = Py.run(src, { inputs: tests[0].inputs });
    renderConsole(consoleEl, res, { src });
    if (res.needInput) {
      consoleEl.append(h(`<div class="explain"><b>Програма чекає ще одне введення</b>У цьому завданні вводиться лише ${tests[0].inputs.length === 1 ? 'одне значення' : tests[0].inputs.length + ' значення'}. Перевір, скільки разів у програмі викликається <code>input()</code>.</div>`));
    }
    const st = evalChecks(c, src, res, tests[0].inputs);
    let allOk = st.every(Boolean) && !res.needInput && !(res.error && res.error.type !== 'Exit');
    let verdict = '';
    if (tests.length > 1) {
      let otherOk = null;
      if (allOk) {
        otherOk = true;
        for (const t of tests.slice(1)) {
          const r = Py.run(src, { inputs: t.inputs });
          if (r.error || r.needInput || !evalChecks(c, src, r, t.inputs).every(Boolean)) { otherOk = false; verdict = `<div class="verdict bad">Для «${esc(tests[0].inputs[0])}» усе працює, а для «${esc(t.inputs[0])}» — ні. Схоже, значення вписане в програму вручну. Програма має використовувати те, що ввели.</div>`; break; }
        }
      }
      st.push(otherOk);
      allOk = allOk && otherOk === true;
    }
    if (!allOk) {
      if (steps) p['f' + stepIdx] = (p['f' + stepIdx] || 0) + 1; else p.fails++;
      save();
      if (!verdict) {
        const diffCheck = c.checks.findIndex((x, k) => x.diff && !st[k]);
        if (res.error) verdict = '<div class="verdict bad">Програма завершилася з помилкою. Пояснення — під результатом у вікні оболонки.</div>';
        else if (diffCheck >= 0 && st.slice(0, c.checks.length).filter(v => !v).length === 1) {
          const got = norm(Py.outputText(res));
          verdict = `<div class="verdict bad">Результат відрізняється від очікуваного. Порівняй уважно — кожен символ має значення.<div class="diff"><span>Очікувалось:</span><span>${esc(c.checks[diffCheck].diff)}</span><span>Отримано:</span><span>${got ? esc(got) : '(нічого)'}</span></div></div>`;
        } else verdict = '<div class="verdict bad">Ще не все виконано — подивись, які перевірки не пройдено.</div>';
      }
      drawBrief(st, verdict);
      return;
    }
    // успіх
    if (steps && stepIdx < steps.length - 1) {
      stepIdx++; S.step[m.id] = stepIdx; save();
      toast(`Програму полагоджено! Залишилось ${steps.length - stepIdx}.`);
      mountEditor();
      return;
    }
    drawBrief(st, '<div class="verdict good">Усі перевірки пройдено!</div>');
    let stars = 3;
    const usedHints = steps ? steps.some((_, k) => p['h' + k]) : p.hints > 0;
    const totalFails = steps ? steps.reduce((a, _, k) => a + (p['f' + k] || 0), 0) : p.fails;
    if (usedHints) stars--;
    if (totalFails >= (steps ? 6 : 4)) stars--;
    if (p.sol) stars = 1;
    complete(i, Math.max(1, stars));
  }

  ide.querySelector('[data-act="run"]').addEventListener('click', runIt);
  ide.querySelector('[data-act="reset"]').addEventListener('click', () => {
    editor.value = cur().starter;
    consoleEl.innerHTML = '<span class="placeholder">Код повернуто до початкового.</span>';
    editor.focus();
  });
  mountEditor();
}

/* ===== Завершення відсіку ===== */
function complete(i, stars) {
  const m = MISSIONS[i];
  const prev = S.done[m.id];
  const firstTime = !prev;
  S.done[m.id] = { stars: Math.max(stars, prev ? prev.stars : 0) };
  delete S.prog[m.id];
  if (m.steps) S.step[m.id] = 0;
  if (firstTime) justLit = m.id;
  saveNow(); updateTopbar();
  const last = doneCount() === MISSIONS.length;
  const nxt = MISSIONS.findIndex((x, k) => k > i && !S.done[x.id]);
  const nextI = nxt >= 0 ? nxt : nextIndex();
  openModal(`<h2>Відсік «${esc(m.name)}» працює</h2>
    <div class="big-stars" aria-label="${stars} з 3 зірок">${starStr(stars)}</div>
    <p style="color:var(--ink-soft)">${stars === 3 ? 'Бездоганно — без жодної підказки.' : stars === 2 ? 'Чудово! Наступного разу спробуй без підказок.' : 'Відсік відновлено. Можеш повернутися сюди пізніше й пройти без підказки.'}</p>
    <div class="learned"><b>Що ти вмієш тепер:</b> ${esc(m.learned)}</div>
    <div class="modal-actions">
      ${last ? '<button class="btn amber" data-act="station">Подивитися на станцію</button>' : nextI >= 0 ? `<button class="btn amber" data-act="next">Наступний відсік: ${esc(MISSIONS[nextI].name)}</button>` : ''}
      <button class="btn plain" data-act="station-plain">До станції</button>
    </div>`, root => {
    root.querySelector('[data-act="next"]')?.addEventListener('click', () => { location.hash = '#/m/' + MISSIONS[nextI].id; });
    root.querySelector('[data-act="station"]')?.addEventListener('click', () => { location.hash = '#/'; });
    root.querySelector('[data-act="station-plain"]').addEventListener('click', () => { if (location.hash === '#/' ) route(); else location.hash = '#/'; });
  });
}

/* ===== Вибір відповіді ===== */
function renderChoice(i) {
  const m = MISSIONS[i];
  const p = prog(m.id);
  let k = 0;
  const wrap = h(`<div class="quiz">${briefHead(i)}<div class="quiz-top"><div class="qdots"></div><span class="mtopic"></span></div><div class="qcard"></div></div>`);
  app.append(wrap);
  const card = wrap.querySelector('.qcard');
  const order = m.items.map(it => it.options.map((_, j) => j).sort(() => Math.random() - .5));
  function draw() {
    const it = m.items[k];
    const ord = order[k];
    wrap.querySelector('.qdots').innerHTML = m.items.map((_, j) => `<i class="${j < k ? 'ok' : j === k ? 'cur' : ''}"></i>`).join('');
    wrap.querySelector('.mtopic').textContent = `Запис ${k + 1} з ${m.items.length}`;
    card.innerHTML = `<div class="q">${it.code ? 'Що виведе програма?' : esc(it.q)}</div>
      ${it.code ? `<pre class="qcode">${highlight(it.code).trimEnd()}</pre>` : ''}
      <div class="opts">${ord.map((j, pos) => `<button class="opt ${it.codeOpts ? 'code-opt' : ''}" type="button" data-j="${j}"><span class="k">${pos + 1}</span><span>${esc(it.options[j])}</span></button>`).join('')}</div>
      <div class="qfeed" aria-live="polite"></div><div class="qnext"></div>`;
    card.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => pick(+b.dataset.j)));
  }
  function pick(j) {
    const it = m.items[k];
    const btn = card.querySelector(`.opt[data-j="${j}"]`);
    const feed = card.querySelector('.qfeed');
    if (j !== it.answer) {
      btn.classList.add('wrong'); btn.disabled = true;
      p.mistakes++; save();
      feed.innerHTML = `<div class="verdict bad">Ні, не так. Подумай ще раз.</div>`;
      return;
    }
    btn.classList.add('right');
    card.querySelectorAll('.opt').forEach(b => b.disabled = true);
    let actual = '';
    if (it.code) {
      const r = Py.run(it.code);
      actual = `<div class="actual">Справжній Python виводить:<pre class="expected" style="margin-top:6px">${esc(Py.outputText(r).replace(/\n$/, ''))}</pre></div>`;
    }
    feed.innerHTML = `<div class="verdict good">${esc(it.explain)}</div>${actual}`;
    const last = k === m.items.length - 1;
    const nb = h(`<button class="btn" type="button">${last ? 'Відновити відсік' : 'Далі'}</button>`);
    card.querySelector('.qnext').append(nb);
    nb.addEventListener('click', () => {
      if (last) { const mist = p.mistakes; complete(i, mist === 0 ? 3 : mist <= 2 ? 2 : 1); }
      else { k++; draw(); card.querySelector('.opt')?.focus(); }
    });
    nb.focus();
  }
  card.addEventListener('keydown', e => {
    if (/^[1-4]$/.test(e.key)) { const b = card.querySelectorAll('.opt')[+e.key - 1]; if (b && !b.disabled) b.click(); }
  });
  draw();
}

/* ===== Сканер типів ===== */
function renderTypes(i) {
  const m = MISSIONS[i];
  const wrap = h(`<div class="quiz">${briefHead(i)}<div class="task" style="margin-bottom:6px">${m.task}</div><div class="quiz-top"><div class="qdots"></div><span class="mtopic"></span></div><div class="qcard"></div></div>`);
  app.append(wrap);
  const card = wrap.querySelector('.qcard');
  let items, k, right, answered;
  function start() {
    items = TYPE_POOL.slice().sort(() => Math.random() - .5).slice(0, 10);
    k = 0; right = 0; draw();
  }
  function cls(v) { return v.startsWith("'") ? 's' : (v === 'True' || v === 'False') ? 'b' : 'n'; }
  function draw() {
    answered = false;
    const [val] = items[k];
    wrap.querySelector('.qdots').innerHTML = items.map((_, j) => `<i class="${j < k ? 'ok' : j === k ? 'cur' : ''}"></i>`).join('');
    wrap.querySelector('.mtopic').textContent = `Контейнер ${k + 1} з 10 · правильно: ${right}`;
    card.innerHTML = `<div class="scan-value"><span class="${cls(val)}">${esc(val)}</span></div>
      <div class="types">${Object.keys(TYPE_INFO).map((t, j) => `<button class="tbtn" type="button" data-t="${t}"><b>${t}</b><small>${j + 1} · ${TYPE_INFO[t].sub}</small></button>`).join('')}</div>
      <div class="qfeed" aria-live="polite"></div><div class="qnext"></div>`;
    card.querySelectorAll('.tbtn').forEach(b => b.addEventListener('click', () => pick(b.dataset.t)));
  }
  function pick(t) {
    if (answered) return; answered = true;
    const [val, ans] = items[k];
    card.querySelectorAll('.tbtn').forEach(b => { b.disabled = true; if (b.dataset.t === ans) b.classList.add('right'); else if (b.dataset.t === t) b.classList.add('wrong'); });
    const ok = t === ans; if (ok) right++;
    card.querySelector('.qfeed').innerHTML = `<div class="verdict ${ok ? 'good' : 'bad'}">${ok ? 'Так! ' : `Ні, це ${ans}. `}${esc(TYPE_INFO[ans].why)}</div>`;
    wrap.querySelector('.mtopic').textContent = `Контейнер ${k + 1} з 10 · правильно: ${right}`;
    const last = k === items.length - 1;
    const nb = h(`<button class="btn" type="button">${last ? 'Підсумок' : 'Наступний контейнер'}</button>`);
    card.querySelector('.qnext').append(nb);
    nb.addEventListener('click', () => { if (last) finish(); else { k++; draw(); } });
    nb.focus();
  }
  function finish() {
    if (right >= 8) { complete(i, right === 10 ? 3 : right === 9 ? 2 : 1); return; }
    card.innerHTML = `<h2 style="font-size:24px;margin-bottom:8px">Правильно ${right} з 10</h2>
      <p>Для відновлення відсіку потрібно щонайменше 8. Згадай: лапки → str, крапка → float, True/False → bool, ціле без крапки → int.</p>
      <div class="qnext"><button class="btn amber" type="button">Сканувати ще раз</button></div>`;
    card.querySelector('button').addEventListener('click', start);
  }
  card.addEventListener('keydown', e => { if (/^[1-4]$/.test(e.key)) { const b = card.querySelectorAll('.tbtn')[+e.key - 1]; if (b && !b.disabled) b.click(); } });
  document.addEventListener('keydown', function typesKeys(e) {
    if (!document.body.contains(card)) { document.removeEventListener('keydown', typesKeys); return; }
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || $('#modalRoot').childElementCount) return;
    if (/^[1-4]$/.test(e.key) && !card.contains(e.target)) { const b = card.querySelectorAll('.tbtn')[+e.key - 1]; if (b && !b.disabled) b.click(); }
  });
  start();
}

/* ===== Пісочниця ===== */
function renderSandbox() {
  app.innerHTML = '';
  app.append(h(`<div class="crumbs"><a class="back" href="#/"><span aria-hidden="true">‹</span> До станції</a></div>`));
  app.append(h(`<div><h1 class="page-title">Пісочниця</h1><p class="page-sub">Тут можна писати будь-які програми з уроку й експериментувати. У рядку <span class="mono">&gt;&gt;&gt;</span> внизу команди виконуються одразу, як в оболонці IDLE.</p></div>`));
  const wrap = h(`<div class="sandbox"><section></section><aside class="sheet"></aside></div>`);
  app.append(wrap);
  const ide = h(`<div class="ide">
    <div class="ide-bar"><div class="dots"><i></i><i></i><i></i></div><span class="ide-title">sandbox.py</span>
      <div class="ide-actions"><select class="ghost" aria-label="Приклади з уроку"><option value="">Приклади з уроку…</option>${EXAMPLES.map((e, j) => `<option value="${j}">${esc(e[0])}</option>`).join('')}</select>
      <button class="run" type="button">Запустити <kbd>F5</kbd></button></div></div>
    <div class="ed-slot"></div>
    <div class="console-head"><span>Оболонка</span><button class="ghost" type="button" data-act="clear">Очистити</button></div>
    <div class="console" aria-live="polite"><span class="placeholder">Тут з’явиться результат.</span></div>
    <label class="repl"><span class="prompt">&gt;&gt;&gt;</span><input aria-label="Команда для оболонки" placeholder="наприклад, 7 * 6" autocomplete="off" spellcheck="false"></label>
  </div>`);
  wrap.firstElementChild.append(ide);
  wrap.lastElementChild.innerHTML = `<h3>Шпаргалка</h3><dl>
    <dt>print(...)</dt><dd>вивести на екран</dd>
    <dt>input('...')</dt><dd>запитати дані (завжди рядок)</dd>
    <dt>int(...) float(...)</dt><dd>перетворити на число</dd>
    <dt>str(...)</dt><dd>перетворити на рядок</dd>
    <dt>type(...)</dt><dd>дізнатися тип значення</dd>
    <dt>+ - * /</dt><dd>додавання, віднімання, множення, ділення</dd>
    <dt>// %</dt><dd>ціла частина й остача від ділення</dd>
    <dt>**</dt><dd>піднесення до степеня</dd>
    <dt>x = 5</dt><dd>покласти значення у змінну</dd>
    <dt>for i in range(n):</dt><dd>повторити n разів (з відступом)</dd>
    <dt># ...</dt><dd>коментар, Python його пропускає</dd>
  </dl><p style="margin-top:12px;color:var(--ink-soft)">Пасхалки: спробуй <span class="mono">import this</span> і <span class="mono">import antigravity</span>.</p>`;
  const consoleEl = ide.querySelector('.console');
  let replEnv = Object.create(null);
  let pending = null; // {src, inputs}
  let transcript = []; // попередні записи оболонки (HTML-вузли)

  function runProgram(src, inputs) {
    const res = Py.run(src, { inputs });
    replEnv = res.env;
    renderConsole(consoleEl, res, { src, note: '=== Запуск програми ===' });
    transcript = [];
    if (res.needInput) {
      pending = { src, inputs };
      const line = h(`<span class="in-line"><input aria-label="Введення для програми" autocomplete="off" spellcheck="false"></span>`);
      consoleEl.lastChild && consoleEl.lastChild.nodeType === 1 && consoleEl.lastChild.tagName === 'SPAN' ? consoleEl.lastChild.after(line) : consoleEl.append(line);
      const inp = line.querySelector('input');
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); runProgram(src, inputs.concat([inp.value])); } });
      inp.focus();
    } else pending = null;
  }
  const editor = makeEditor(ide.querySelector('.ed-slot'), S.code.__sandbox ?? EXAMPLES[0][1], v => { S.code.__sandbox = v; save(); }, () => runProgram(editor.value, []), { tall: true });
  ide.querySelector('.run').addEventListener('click', () => runProgram(editor.value, []));
  ide.querySelector('select').addEventListener('change', e => { if (e.target.value !== '') { editor.value = EXAMPLES[+e.target.value][1]; e.target.value = ''; editor.focus(); } });
  ide.querySelector('[data-act="clear"]').addEventListener('click', () => { consoleEl.innerHTML = ''; });
  const repl = ide.querySelector('.repl input');
  const hist = []; let hi = 0;
  repl.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp') { if (hi > 0) { hi--; repl.value = hist[hi]; } e.preventDefault(); return; }
    if (e.key === 'ArrowDown') { if (hi < hist.length) { hi++; repl.value = hist[hi] || ''; } e.preventDefault(); return; }
    if (e.key !== 'Enter') return;
    const line = repl.value; if (!line.trim()) return;
    hist.push(line); hi = hist.length; repl.value = '';
    if (consoleEl.querySelector('.placeholder')) consoleEl.innerHTML = '';
    const block = document.createElement('div');
    block.append(h(`<div><span class="prompt">&gt;&gt;&gt; </span>${esc(line)}</div>`));
    const res = Py.run(line, { env: replEnv, repl: true });
    const out = document.createElement('div');
    if (res.needInput) { res.error = null; out.append(h('<span class="sys">У рядку &gt;&gt;&gt; input() не працює — напиши програму в редакторі й запусти її.</span>')); }
    else renderConsole(out, res, { quietEmpty: true });
    block.append(out);
    consoleEl.append(block);
    consoleEl.scrollTop = consoleEl.scrollHeight;
  });
}

/* ===== Модальні вікна, повідомлення ===== */
let lastFocus = null;
function openModal(html, bind) {
  lastFocus = document.activeElement;
  const root = $('#modalRoot');
  root.innerHTML = '';
  const md = h(`<div class="modal" role="dialog" aria-modal="true"><div class="modal-card">${html}</div></div>`);
  root.append(md);
  bind && bind(md);
  md.addEventListener('click', e => { if (e.target === md) closeModal(); });
  md.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'Tab') {
      const f = md.querySelectorAll('button, input, a[href], select'); if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }
  });
  setTimeout(() => (md.querySelector('.btn, button, input') || md).focus(), 30);
}
function closeModal() { const r = $('#modalRoot'); if (r.childElementCount) { r.innerHTML = ''; lastFocus && lastFocus.focus && document.body.contains(lastFocus) && lastFocus.focus(); } }
let toastTimer = null;
function toast(msg) {
  const r = $('#toastRoot'); r.innerHTML = ''; r.append(h(`<div class="toast">${esc(msg)}</div>`));
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { r.innerHTML = ''; }, 3800);
}

function showCertificate() {
  const st = starsTotal(), max = MISSIONS.length * 3;
  const rank = st >= 32 ? 'Капітан станції' : st >= 24 ? 'Бортінженер' : 'Кадет-рятівник';
  const date = new Date().toLocaleDateString('uk-UA', { day: 'numeric', month: 'long', year: 'numeric' });
  openModal(`<div class="cert">
      <div style="color:var(--ink-soft)">Станцію «Пітон-1» відновлено</div>
      <div class="who">${esc(S.name || 'Кадет')}</div>
      <div class="rank">${rank}</div>
      <div class="big-stars" style="letter-spacing:0">★ ${st} <span style="font-size:20px;color:var(--ink-soft)">з ${max}</span></div>
      <div style="color:var(--ink-soft);font-size:14px">${date}</div>
    </div>
    <p style="margin-top:14px">Позаду перші програми на Python: print(), арифметика, змінні, типи даних, input() і цикл for. Покажи цей екран учителю.</p>
    <p style="color:var(--ink-soft);font-size:15px">Наступного уроку — списки: як зберегти в програмі не одне значення, а цілий ряд.</p>
    <div class="modal-actions"><button class="btn amber" data-act="ok">Готово</button><a class="btn plain" href="#/sandbox" style="text-decoration:none">До пісочниці</a></div>`,
    root => root.querySelector('[data-act="ok"]').addEventListener('click', closeModal));
}

function teacherPanel() {
  openModal(`<div class="teacher"><h2>Для вчителя</h2>
    <p style="color:var(--ink-soft);font-size:15px">Прогрес зберігається лише в цьому браузері на цьому пристрої. На спільних комп’ютерах скидайте його між класами.</p>
    <label><input type="checkbox" id="unlockAll" ${S.unlockAll ? 'checked' : ''}> Відкрити всі відсіки (без проходження по черзі)</label>
    <div class="modal-actions" style="margin-top:4px"><button class="btn plain" type="button" data-act="reset">Скинути прогрес на цьому пристрої</button>${doneCount() === MISSIONS.length ? '<button class="btn plain" type="button" data-act="cert">Показати підсумок</button>' : ''}</div>
    <h3 style="margin-top:18px;font-size:18px">Відсіки й слайди презентації</h3>
    <table>${MISSIONS.map((m, i) => `<tr><td>${i + 1}</td><td>${esc(m.name)}</td><td>${esc(m.topic)}</td><td>сл. ${m.slide}</td></tr>`).join('')}</table>
    <div class="modal-actions"><button class="btn" type="button" data-act="close">Закрити</button></div></div>`, root => {
    root.querySelector('#unlockAll').addEventListener('change', e => { S.unlockAll = e.target.checked; saveNow(); });
    root.querySelector('[data-act="close"]').addEventListener('click', () => { closeModal(); route(); });
    root.querySelector('[data-act="cert"]')?.addEventListener('click', showCertificate);
    const rb = root.querySelector('[data-act="reset"]');
    rb.addEventListener('click', () => {
      if (rb.dataset.confirm) {
        const keepUnlock = S.unlockAll;
        Object.assign(S, { name: '', done: {}, code: {}, prog: {}, step: {}, unlockAll: keepUnlock, celebrated: false });
        saveNow(); closeModal(); location.hash = '#/'; route(); toast('Прогрес скинуто.');
      } else { rb.dataset.confirm = '1'; rb.textContent = 'Так, скинути все'; rb.style.borderColor = 'var(--bad)'; rb.style.color = 'var(--bad)'; }
    });
  });
}
$('#teacherBtn').addEventListener('click', teacherPanel);

route();
</script>
