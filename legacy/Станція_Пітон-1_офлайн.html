<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Станція «Пітон-1» — перші кроки в Python</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --space: #173A2C;
  --space-2: #1F4A39;
  --ink: #22302A;
  --ink-soft: #55675D;
  --leaf: #2F7D5A;
  --leaf-soft: #D6EADE;
  --mint: #EAF4EE;
  --paper: #FFFFFF;
  --line: #C9D8CF;
  --amber: #E0A526;
  --amber-ink: #6B4A00;
  --amber-soft: #FBF0D3;
  --code: #1E2923;
  --code-2: #26342D;
  --code-ink: #E8EFEA;
  --code-mute: #8FA89A;
  --c-kw: #F3D56B;
  --c-str: #A9D98C;
  --c-num: #8EC9F2;
  --c-err: #FF9F8E;
  --bad: #B3402E;
  --bad-soft: #FBE3DE;
  --good: #2F7D5A;
  --page: var(--mint);
  --panel: var(--paper);
  --serif: "PT Serif", Cambria, Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", Calibri, "Segoe UI", Roboto, Arial, sans-serif;
  --mono: "JetBrains Mono", Consolas, "Courier New", monospace;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #10201A; --panel: #172A22; --ink: #E3ECE6; --ink-soft: #A3B6AB; --line: #2E463B;
    --leaf-soft: #1E3A2E; --amber-soft: #3A3018; --amber-ink: #F3D56B; --bad-soft: #3D2320; --bad: #FF9F8E; --good: #7FCFA2; --mint: #10201A;
  }
}
:root[data-theme="dark"] {
  --page: #10201A; --panel: #172A22; --ink: #E3ECE6; --ink-soft: #A3B6AB; --line: #2E463B;
  --leaf-soft: #1E3A2E; --amber-soft: #3A3018; --amber-ink: #F3D56B; --bad-soft: #3D2320; --bad: #FF9F8E; --good: #7FCFA2; --mint: #10201A;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--page); color: var(--ink); font: 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--serif); font-weight: 700; line-height: 1.2; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; border-radius: 6px; }
code, .mono { font-family: var(--mono); font-size: .92em; }
p { margin: 0 0 .8em; }
a { color: var(--leaf); }
[hidden] { display: none !important; }

/* ---------- верхня панель ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--space); color: #E8EFEA; }
.topbar-in { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 18px; padding: 10px 20px; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 4px; color: inherit; text-decoration: none; }
.brand svg { flex: none; }
.brand b { font-family: var(--serif); font-size: 20px; letter-spacing: .01em; }
.brand small { display: block; font-size: 12px; color: #A9C2B5; line-height: 1.1; }
.meter { margin-left: auto; display: flex; align-items: center; gap: 14px; font-size: 14px; }
.cells { display: flex; gap: 3px; }
.cells i { width: 10px; height: 16px; border-radius: 2px; background: #2E4D3F; display: block; }
.cells i.on { background: var(--amber); }
.stars-total { color: var(--c-kw); white-space: nowrap; }
.tb-btn { text-decoration: none; background: transparent; border: 1px solid #3F6352; color: #E8EFEA; padding: 7px 14px; border-radius: 999px; font-size: 14px; white-space: nowrap; }
.tb-btn:hover { background: #24503E; }
.tb-btn.primary { background: var(--amber); border-color: var(--amber); color: #2A1E00; font-weight: 600; }
.tb-btn.primary:hover { background: #F0B83A; }
.pt-short, .tb-short { display: none; }
@media (max-width: 760px) {
  .brand small, .cells { display: none; }
  .pt-long, .tb-long { display: none; }
  .pt-short, .tb-short { display: inline; }
  .meter { gap: 8px; }
  .topbar-in { gap: 8px; padding: 8px 12px; }
  .tb-btn { padding: 6px 10px; }
}

main { max-width: 1240px; margin: 0 auto; padding: 20px 20px 60px; }

/* ---------- станція ---------- */
.hero { background: var(--space); color: #E8EFEA; border-radius: 22px; padding: 22px 22px 14px; position: relative; overflow: hidden; }
.hero-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px 24px; margin-bottom: 6px; }
.hero h1 { font-size: clamp(26px, 3.4vw, 40px); }
.hero .status { color: #A9C2B5; font-size: 15px; max-width: 46ch; }
.station { width: 100%; height: auto; display: block; }
.station .mod { cursor: pointer; }
.station .mod.locked { cursor: not-allowed; }
.station .mod:focus { outline: none; }
.station .mod:focus-visible .hull { stroke: var(--amber); stroke-width: 4; }
.station .hull { transition: fill .6s, stroke .6s; }
.station .mod.next .hull { stroke: var(--amber); stroke-width: 3; }
.station .mod.next .beacon { animation: beacon 1.6s ease-in-out infinite; }
@keyframes beacon { 50% { opacity: .15; } }
.station .mod.just-lit .glow { animation: lightup 1.8s ease-out 1; }
@keyframes lightup { 0% { opacity: 0; } 30% { opacity: .9; } 100% { opacity: .35; } }
.station .lbl { font-family: var(--sans); font-size: 15px; fill: #E8EFEA; }
.station .num { font-family: var(--serif); font-size: 22px; font-weight: 700; }
@media (max-width: 760px) { .station .lbl { display: none; } .station .num { font-size: 30px; } }

/* вступ */
.intro { position: absolute; inset: 0; background: rgba(15, 38, 29, .93); display: grid; place-items: center; padding: 20px; z-index: 2; }
.intro-card { max-width: 560px; }
.intro-card h2 { font-size: clamp(24px, 3vw, 34px); margin-bottom: 12px; }
.intro-card p { color: #CFE0D6; font-size: 17px; line-height: 1.6; }
.intro-form { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.intro-form label { width: 100%; font-size: 14px; color: #A9C2B5; }
.intro-form input { flex: 1 1 220px; font: 17px var(--sans); padding: 11px 14px; border-radius: 10px; border: 1px solid #4A6E5D; background: #0F261D; color: #fff; }
@media (max-width: 560px) { .hero { padding: 16px 12px 10px; } .intro { position: relative; inset: auto; margin: -16px -12px 0; } }

/* список відсіків */
.missions-head { display: flex; justify-content: space-between; align-items: baseline; margin: 30px 2px 12px; gap: 12px; flex-wrap: wrap; }
.missions-head h2 { font-size: 24px; }
.missions-head p { margin: 0; color: var(--ink-soft); font-size: 15px; }
.mlist { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); column-gap: 28px; }
.mlist li { border-top: 1px solid var(--line); }
.mrow { width: 100%; display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: center; padding: 13px 4px; background: none; border: 0; text-align: left; }
.mrow:hover:not(:disabled) .mname { text-decoration: underline; text-underline-offset: 3px; }
.mrow:disabled { cursor: not-allowed; opacity: .55; }
.mnum { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font: 700 18px var(--serif); background: var(--panel); border: 1px solid var(--line); }
.done .mnum { background: var(--leaf); color: #fff; border-color: var(--leaf); }
.next .mnum { background: var(--amber); color: #2A1E00; border-color: var(--amber); }
.mname { font-weight: 600; display: block; }
.mtopic { font-size: 14px; color: var(--ink-soft); }
.mright { font-size: 14px; color: var(--ink-soft); white-space: nowrap; }
.mright .st { color: var(--amber); font-size: 16px; letter-spacing: 1px; }
.mright .st .off { color: var(--line); }
.pill-next { background: var(--amber-soft); color: var(--amber-ink); padding: 3px 10px; border-radius: 999px; font-weight: 600; }

/* ---------- екран місії ---------- */
.crumbs { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.back { color: var(--ink); text-decoration: none; background: var(--panel); border: 1px solid var(--line); padding: 7px 14px 7px 10px; border-radius: 999px; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
.back:hover { border-color: var(--leaf); }
.crumbs .where { color: var(--ink-soft); font-size: 14px; }
.mission { display: grid; grid-template-columns: minmax(300px, 420px) 1fr; gap: 24px; align-items: start; }
@media (max-width: 920px) { .mission { grid-template-columns: 1fr; } }
@media (max-width: 560px) { main { padding: 14px 12px 50px; } .ide .dots, .ed-hint { display: none; } .mlist { grid-template-columns: 1fr; } }
.brief h1 { font-size: clamp(28px, 3vw, 36px); margin-bottom: 6px; }
.tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; font-size: 13px; }
.tag { background: var(--leaf-soft); color: var(--good); padding: 3px 10px; border-radius: 6px; font-weight: 600; }
.tag.slide { background: transparent; border: 1px solid var(--line); color: var(--ink-soft); font-weight: 500; }
.story { color: var(--ink-soft); font-size: 15.5px; font-style: italic; font-family: var(--serif); line-height: 1.6; }
.block { margin-top: 18px; }
.block h3 { font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--ink-soft); margin-bottom: 6px; }
.task { font-size: 16.5px; }
.task code, .story code, .hint-text code, .explain code { background: var(--leaf-soft); padding: 1px 5px; border-radius: 4px; color: var(--ink); }
.expected { background: var(--code); color: var(--code-ink); font: 14.5px/1.55 var(--mono); padding: 12px 14px; border-radius: 10px; white-space: pre-wrap; margin: 0; }
.expected .in { color: var(--c-str); }
.inputs-note { font-size: 14px; color: var(--ink-soft); margin-top: 6px; }
.checks { list-style: none; margin: 0; padding: 0; }
.checks li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 5px 0; font-size: 15px; }
.checks li::before { content: ""; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); margin-top: 3px; }
.checks li.ok::before { border-color: var(--good); background: var(--good); box-shadow: inset 0 0 0 3px var(--panel); }
.checks li.fail::before { border-color: var(--bad); background: var(--bad-soft); }
.checks li.fail { color: var(--bad); }
.verdict { margin-top: 14px; padding: 12px 14px; border-radius: 10px; font-size: 15px; }
.verdict.bad { background: var(--bad-soft); color: var(--ink); border-left: 4px solid var(--bad); }
.verdict.good { background: var(--leaf-soft); border-left: 4px solid var(--good); }
.verdict .diff { font: 13.5px/1.5 var(--mono); white-space: pre-wrap; margin-top: 6px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
.hints { display: flex; flex-direction: column; gap: 8px; }
.hint-btn { align-self: flex-start; background: var(--panel); border: 1px dashed var(--ink-soft); padding: 6px 12px; border-radius: 8px; font-size: 14px; }
.hint-btn:hover { border-style: solid; }
.hint-text { background: var(--amber-soft); border-radius: 10px; padding: 10px 12px; font-size: 15px; white-space: pre-wrap; }
.sol-btn { align-self: flex-start; background: none; border: 0; padding: 4px 0; font-size: 14px; color: var(--ink-soft); text-decoration: underline; }

/* ---------- IDE ---------- */
.ide { background: var(--code); border-radius: 14px; overflow: hidden; box-shadow: 0 18px 40px -24px rgba(10, 30, 20, .55); color: var(--code-ink); }
.ide-bar { display: flex; align-items: center; gap: 12px; padding: 9px 12px; background: #17201C; }
.dots { display: flex; gap: 6px; }
.dots i { width: 11px; height: 11px; border-radius: 50%; display: block; }
.dots i:nth-child(1) { background: #FF5F57; } .dots i:nth-child(2) { background: #FEBC2E; } .dots i:nth-child(3) { background: #28C840; }
.ide-title { font: 13px var(--mono); color: var(--code-mute); }
.ide-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.run { background: var(--amber); color: #2A1E00; border: 0; border-radius: 8px; padding: 7px 14px; font-weight: 600; font-size: 14px; display: inline-flex; gap: 8px; align-items: center; }
.run:hover { background: #F0B83A; }
.run kbd { font: 11px var(--mono); background: rgba(0,0,0,.14); padding: 1px 5px; border-radius: 4px; }
.ghost { white-space: nowrap; background: transparent; border: 1px solid #3A4C43; color: var(--code-ink); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
.ghost:hover { background: #26342D; }
.ide select.ghost { padding: 6px 8px; }
.ide select.ghost option { color: #000; }

.editor { display: grid; grid-template-columns: 44px 1fr; height: 280px; border-bottom: 1px solid #33443B; position: relative; }
.editor.tall { height: 340px; }
.gutter { font: 15px/1.6 var(--mono); color: #5E7468; text-align: right; padding: 12px 10px 12px 0; overflow: hidden; user-select: none; background: #1A241F; }
.gutter div { height: 24px; }
.code-area { position: relative; overflow: hidden; }
.code-area textarea, .code-area pre { position: absolute; inset: 0; margin: 0; padding: 12px 14px; font: 15px/1.6 var(--mono); tab-size: 4; white-space: pre; border: 0; letter-spacing: 0; }
.code-area pre { pointer-events: none; color: var(--code-ink); overflow: hidden; }
.code-area pre code { font: inherit; display: block; }
.code-area textarea { background: transparent; color: transparent; caret-color: var(--c-kw); resize: none; outline: none; overflow: auto; }
.code-area textarea::selection { background: rgba(142, 201, 242, .3); color: transparent; }
.code-area textarea:focus-visible { box-shadow: inset 0 0 0 2px rgba(224, 165, 38, .55); }
.tk-kw { color: var(--c-kw); } .tk-str { color: var(--c-str); } .tk-num { color: var(--c-num); } .tk-com { color: var(--code-mute); font-style: italic; } .tk-op { color: #C9D8CF; }
.ed-hint { position: absolute; right: 10px; bottom: 6px; font: 11px var(--sans); color: #5E7468; pointer-events: none; }

.console-head { display: flex; align-items: center; justify-content: space-between; padding: 7px 14px; font: 12.5px var(--sans); color: var(--code-mute); background: #19231E; }
.console { font: 14.5px/1.55 var(--mono); padding: 10px 14px 14px; min-height: 150px; max-height: 320px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
.console .placeholder { color: #5E7468; }
.console .in { color: var(--c-str); }
.console .err { color: var(--c-err); }
.console .sys { color: var(--code-mute); font-style: italic; }
.console .prompt { color: var(--c-kw); }
.explain { margin-top: 10px; background: #F7EFE0; color: #3A2A10; border-radius: 8px; padding: 10px 12px; font: 14.5px/1.5 var(--sans); white-space: normal; }
.explain b { display: block; margin-bottom: 2px; }
.explain code { background: rgba(0,0,0,.07); color: #3A2A10; }
.in-line { display: flex; align-items: center; gap: 6px; }
.in-line input { flex: 1; min-width: 60px; background: transparent; border: 0; border-bottom: 1px dashed var(--c-str); color: var(--c-str); font: inherit; padding: 0 2px; outline: none; }
.repl { display: flex; gap: 8px; align-items: center; padding: 8px 14px 12px; border-top: 1px solid #2D3B34; font: 14.5px var(--mono); }
.repl input { flex: 1; background: transparent; border: 0; color: var(--code-ink); font: inherit; outline: none; }
.repl input:focus-visible { box-shadow: 0 1px 0 var(--amber); }

/* ---------- вибір / сканер ---------- */
.quiz { max-width: 720px; margin: 0 auto; }
.quiz-top { display: flex; justify-content: space-between; align-items: center; margin: 18px 0 10px; gap: 12px; }
.qdots { display: flex; gap: 6px; }
.qdots i { width: 28px; height: 6px; border-radius: 3px; background: var(--line); display: block; }
.qdots i.cur { background: var(--amber); } .qdots i.ok { background: var(--leaf); }
.qcard { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px; }
.qcard .q { font: 700 21px/1.35 var(--serif); margin-bottom: 14px; }
.qcode { background: var(--code); color: var(--code-ink); font: 16px/1.5 var(--mono); padding: 14px 16px; border-radius: 10px; margin: 0 0 16px; white-space: pre; overflow-x: auto; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 560px) { .opts { grid-template-columns: 1fr; } }
.opt { text-align: left; background: var(--page); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 16px; display: flex; gap: 10px; align-items: baseline; }
.opt .k { font: 600 13px var(--mono); color: var(--ink-soft); }
.opt.code-opt span:last-child { font-family: var(--mono); white-space: pre; }
.opt:hover:not(:disabled) { border-color: var(--leaf); }
.opt.right { border-color: var(--good); background: var(--leaf-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; }
.qfeed { margin-top: 16px; font-size: 15.5px; }
.qfeed .actual { margin-top: 8px; }
.qnext { margin-top: 16px; display: flex; justify-content: flex-end; }
.btn { background: var(--leaf); color: #fff; border: 0; border-radius: 10px; padding: 11px 20px; font-weight: 600; font-size: 15.5px; }
.btn:hover { background: #276B4D; }
.btn.amber { background: var(--amber); color: #2A1E00; } .btn.amber:hover { background: #F0B83A; }
.btn.plain { background: var(--panel); color: var(--ink); border: 1px solid var(--line); }

.scan-value { font: 600 clamp(34px, 6vw, 54px)/1.2 var(--mono); text-align: center; padding: 26px 10px; background: var(--code); color: var(--code-ink); border-radius: 14px; margin-bottom: 16px; }
.scan-value .s { color: var(--c-str); } .scan-value .n { color: var(--c-num); } .scan-value .b { color: var(--c-kw); }
.types { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (max-width: 560px) { .types { grid-template-columns: 1fr 1fr; } }
.tbtn { background: var(--page); border: 2px solid var(--line); border-radius: 12px; padding: 12px 6px; text-align: center; }
.tbtn b { display: block; font: 600 20px var(--mono); }
.tbtn small { color: var(--ink-soft); font-size: 13px; }
.tbtn:hover:not(:disabled) { border-color: var(--leaf); }
.tbtn.right { border-color: var(--good); background: var(--leaf-soft); }
.tbtn.wrong { border-color: var(--bad); background: var(--bad-soft); }

/* ---------- модальні вікна ---------- */
.modal { position: fixed; inset: 0; background: rgba(12, 30, 22, .62); display: grid; place-items: center; z-index: 50; padding: 20px; }
.modal-card { background: var(--panel); border-radius: 18px; max-width: 520px; width: 100%; padding: 26px; max-height: calc(100vh - 40px); overflow: auto; }
.modal-card h2 { font-size: 28px; margin-bottom: 8px; }
.modal-card .big-stars { font-size: 40px; color: var(--amber); letter-spacing: 6px; margin: 6px 0 4px; }
.modal-card .big-stars .off { color: var(--line); }
.modal-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.learned { background: var(--leaf-soft); border-radius: 10px; padding: 10px 12px; font-size: 15px; }
.cert { text-align: center; border: 2px solid var(--amber); border-radius: 14px; padding: 20px 14px; background: var(--amber-soft); }
.cert .who { font: 700 30px var(--serif); margin: 6px 0; }
.cert .rank { font-size: 18px; font-weight: 600; color: var(--good); }
.teacher table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; }
.teacher td { border-top: 1px solid var(--line); padding: 5px 4px; }
.teacher label { display: flex; gap: 10px; align-items: center; font-size: 15px; margin: 10px 0; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--space); color: #E8EFEA; padding: 12px 18px; border-radius: 12px; z-index: 60; max-width: calc(100% - 40px); box-shadow: 0 10px 30px -10px rgba(0,0,0,.5); font-size: 15px; }
.toast a { color: var(--c-kw); }

/* пісочниця */
.sandbox { display: grid; grid-template-columns: 1fr 300px; gap: 22px; align-items: start; }
@media (max-width: 980px) { .sandbox { grid-template-columns: 1fr; } }
.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; font-size: 14.5px; }
.sheet h3 { font-size: 18px; margin-bottom: 8px; }
.sheet dl { margin: 0; }
.sheet dt { font-family: var(--mono); font-size: 14px; color: var(--good); font-weight: 600; }
.sheet dd { margin: 0 0 9px; color: var(--ink-soft); }
.page-title { margin-bottom: 4px; font-size: clamp(26px, 3vw, 34px); }
.page-sub { color: var(--ink-soft); margin-bottom: 16px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">

<script>
/* ===== Міні-інтерпретатор Python (підмножина для вступного уроку) ===== */
const Py = (() => {
  class PyError extends Error {
    constructor(type, msg, line) { super(msg); this.pyType = type; this.pyMsg = msg; this.line = line; }
  }
  class NeedInput extends Error { constructor() { super('need input'); } }
  class BreakSig {} class ContinueSig {}
  const BREAK = new BreakSig(), CONTINUE = new ContinueSig();

  /* ---------- типи ---------- */
  const T = (name, call) => ({ __type: name, call });
  const NONE = null;
  function typeName(v) {
    if (v === null) return 'NoneType';
    switch (typeof v) {
      case 'bigint': return 'int';
      case 'number': return 'float';
      case 'string': return 'str';
      case 'boolean': return 'bool';
    }
    if (Array.isArray(v)) return v.__tuple ? 'tuple' : 'list';
    if (v.__range) return 'range';
    if (v.__type) return 'type';
    if (v.__builtin) return 'builtin_function_or_method';
    if (v.__module) return 'module';
    if (v.__method) return 'builtin_function_or_method';
    return 'object';
  }

  function floatRepr(x) {
    if (Number.isNaN(x)) return 'nan';
    if (!Number.isFinite(x)) return x > 0 ? 'inf' : '-inf';
    if (x === 0) return Object.is(x, -0) ? '-0.0' : '0.0';
    const e = x.toExponential(); // shortest round-trip digits
    let [mant, ex] = e.split('e');
    const exp = parseInt(ex, 10);
    const neg = mant[0] === '-';
    if (neg) mant = mant.slice(1);
    const digits = mant.replace('.', '');
    let s;
    if (exp >= -4 && exp < 16) {
      if (exp >= 0) {
        if (digits.length <= exp + 1) s = digits.padEnd(exp + 1, '0') + '.0';
        else s = digits.slice(0, exp + 1) + '.' + digits.slice(exp + 1);
      } else {
        s = '0.' + '0'.repeat(-exp - 1) + digits;
      }
    } else {
      const m = digits.length > 1 ? digits[0] + '.' + digits.slice(1) : digits;
      const ae = Math.abs(exp);
      s = m + 'e' + (exp < 0 ? '-' : '+') + (ae < 10 ? '0' + ae : String(ae));
    }
    return (neg ? '-' : '') + s;
  }
  function strRepr(s) {
    const q = (s.includes("'") && !s.includes('"')) ? '"' : "'";
    let out = '';
    for (const ch of s) {
      if (ch === '\\') out += '\\\\';
      else if (ch === q) out += '\\' + q;
      else if (ch === '\n') out += '\\n';
      else if (ch === '\t') out += '\\t';
      else if (ch === '\r') out += '\\r';
      else out += ch;
    }
    return q + out + q;
  }
  function repr(v) {
    if (typeof v === 'string') return strRepr(v);
    return str(v, true);
  }
  function str(v, asRepr) {
    if (v === null) return 'None';
    switch (typeof v) {
      case 'bigint': return v.toString();
      case 'number': return floatRepr(v);
      case 'string': return asRepr ? strRepr(v) : v;
      case 'boolean': return v ? 'True' : 'False';
    }
    if (Array.isArray(v)) {
      const inner = v.map(repr).join(', ');
      if (v.__tuple) return v.length === 1 ? '(' + inner + ',)' : '(' + inner + ')';
      return '[' + inner + ']';
    }
    if (v.__range) return v.step === 1n ? `range(${v.start}, ${v.stop})` : `range(${v.start}, ${v.stop}, ${v.step})`;
    if (v.__type) return `<class '${v.__type}'>`;
    if (v.__builtin) return `<built-in function ${v.__builtin}>`;
    if (v.__module) return `<module '${v.__module}'>`;
    if (v.__method) return `<built-in method ${v.__method}>`;
    return '<object>';
  }
  function truthy(v) {
    if (v === null) return false;
    switch (typeof v) {
      case 'bigint': return v !== 0n;
      case 'number': return v !== 0;
      case 'string': return v.length > 0;
      case 'boolean': return v;
    }
    if (Array.isArray(v)) return v.length > 0;
    if (v.__range) return rangeLen(v) > 0n;
    return true;
  }
  const isNum = v => typeof v === 'bigint' || typeof v === 'number' || typeof v === 'boolean';
  const toBig = v => typeof v === 'boolean' ? (v ? 1n : 0n) : v;
  function rangeLen(r) {
    const { start, stop, step } = r;
    if (step > 0n) return stop > start ? (stop - start + step - 1n) / step : 0n;
    return start > stop ? (start - stop - step - 1n) / (-step) : 0n;
  }
  function editDist(a, b) {
    const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
    for (let j = 1; j <= b.length; j++) d[0][j] = j;
    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return d[a.length][b.length];
  }
  function floorDivBig(a, b) {
    const q = a / b;
    if ((a % b !== 0n) && ((a < 0n) !== (b < 0n))) return q - 1n;
    return q;
  }
  function modBig(a, b) { const m = a % b; return (m !== 0n && ((m < 0n) !== (b < 0n))) ? m + b : m; }

  /* ---------- лексер ---------- */
  const KEYWORDS = new Set(['False', 'None', 'True', 'and', 'or', 'not', 'for', 'in', 'while', 'if', 'elif', 'else', 'break', 'continue', 'pass', 'import', 'def', 'return', 'class', 'from', 'as', 'is', 'lambda', 'try', 'except', 'with', 'global', 'del', 'yield', 'raise', 'finally', 'assert', 'nonlocal', 'async', 'await']);
  const OPS = ['**=', '//=', '**', '//', '==', '!=', '<=', '>=', '+=', '-=', '*=', '/=', '%=', '->', '+', '-', '*', '/', '%', '<', '>', '=', '(', ')', '[', ']', '{', '}', ':', ',', '.', ';'];
  const BAD_QUOTES = { '‘': 'U+2018', '’': 'U+2019', '“': 'U+201C', '”': 'U+201D', '«': 'U+00AB', '»': 'U+00BB', '„': 'U+201E', '′': 'U+2032', 'ʼ': 'U+02BC' };

  function tokenize(src) {
    const toks = [];
    const lines = src.replace(/\r\n?/g, '\n').split('\n');
    const indents = [0];
    let depth = 0; const openStack = [];
    for (let ln = 0; ln < lines.length; ln++) {
      let line = lines[ln];
      let L = ln + 1;
      let i = 0;
      if (depth === 0) {
        let col = 0;
        while (i < line.length && (line[i] === ' ' || line[i] === '\t')) { col += line[i] === '\t' ? 4 : 1; i++; }
        if (i >= line.length || line[i] === '#') continue; // порожній рядок / коментар
        const top = indents[indents.length - 1];
        if (col > top) { indents.push(col); toks.push({ t: 'INDENT', line: L }); }
        else if (col < top) {
          while (col < indents[indents.length - 1]) { indents.pop(); toks.push({ t: 'DEDENT', line: L }); }
          if (col !== indents[indents.length - 1]) throw new PyError('IndentationError', 'unindent does not match any outer indentation level', L);
        }
      }
      while (i < line.length) {
        const c = line[i];
        if (c === ' ' || c === '\t') { i++; continue; }
        if (c === '#') break;
        if (c === '\\' && i === line.length - 1) { i++; continue; }
        // рядки
        let pre = '';
        if ((c === 'f' || c === 'F' || c === 'r' || c === 'R') && (line[i + 1] === '"' || line[i + 1] === "'")) { pre = c.toLowerCase(); i++; }
        const q = line[i];
        if (q === '"' || q === "'") {
          const triple = line.substr(i, 3) === q.repeat(3);
          if (triple) {
            let j = i + 3, buf = '', curLine = ln, curStr = line;
            for (;;) {
              const k = curStr.indexOf(q.repeat(3), j);
              if (k >= 0) { buf += curStr.slice(j, k); i = k + 3; break; }
              buf += curStr.slice(j) + '\n';
              curLine++;
              if (curLine >= lines.length) throw new PyError('SyntaxError', `unterminated triple-quoted string literal (detected at line ${lines.length})`, L);
              curStr = lines[curLine]; j = 0;
            }
            toks.push({ t: 'STR', v: pre === 'r' ? buf : unescape(buf), f: pre === 'f', line: L });
            if (curLine !== ln) { ln = curLine; line = curStr; L = ln + 1; }
            continue;
          }
          let j = i + 1, buf = '';
          while (j < line.length && line[j] !== q) {
            if (line[j] === '\\' && j + 1 < line.length) { buf += line[j] + line[j + 1]; j += 2; continue; }
            buf += line[j]; j++;
          }
          if (j >= line.length) throw new PyError('SyntaxError', `unterminated string literal (detected at line ${L})`, L);
          toks.push({ t: 'STR', v: pre === 'r' ? buf : unescape(buf), f: pre === 'f', line: L });
          i = j + 1; continue;
        }
        if (pre) { i--; }
        // числа
        if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(line[i + 1] || ''))) {
          const m = /^(\d[\d_]*)?(\.\d*)?([eE][+-]?\d+)?/.exec(line.slice(i));
          let txt = m[0];
          if (!txt) txt = c;
          const after = line[i + txt.length] || '';
          if (/[\p{L}_]/u.test(after)) throw new PyError('SyntaxError', 'invalid decimal literal', L);
          const clean = txt.replace(/_/g, '');
          if (m[2] !== undefined || m[3] !== undefined) toks.push({ t: 'NUM', v: parseFloat(clean), line: L });
          else {
            if (clean.length > 1 && clean[0] === '0' && /[1-9]/.test(clean)) throw new PyError('SyntaxError', 'leading zeros in decimal integer literals are not permitted; use an 0o prefix for octal integers', L);
            toks.push({ t: 'NUM', v: BigInt(clean), line: L });
          }
          i += txt.length; continue;
        }
        // імена
        const nm = /^[\p{L}_][\p{L}\p{N}_]*/u.exec(line.slice(i));
        if (nm) {
          const w = nm[0];
          toks.push({ t: KEYWORDS.has(w) ? 'KW' : 'NAME', v: w, line: L });
          i += w.length; continue;
        }
        // оператори
        let op = null;
        for (const o of OPS) if (line.startsWith(o, i)) { op = o; break; }
        if (op) {
          if (op === '(' || op === '[' || op === '{') { depth++; openStack.push({ op, line: L }); }
          if (op === ')' || op === ']' || op === '}') {
            const want = { ')': '(', ']': '[', '}': '{' }[op];
            if (!openStack.length) throw new PyError('SyntaxError', `unmatched '${op}'`, L);
            const top = openStack.pop(); depth--;
            if (top.op !== want) throw new PyError('SyntaxError', `closing parenthesis '${op}' does not match opening parenthesis '${top.op}'`, L);
          }
          toks.push({ t: 'OP', v: op, line: L });
          i += op.length; continue;
        }
        if (BAD_QUOTES[c]) throw new PyError('SyntaxError', `invalid character '${c}' (${BAD_QUOTES[c]})`, L);
        if (c === '!' ) throw new PyError('SyntaxError', 'invalid syntax', L);
        throw new PyError('SyntaxError', `invalid character '${c}' (U+${c.codePointAt(0).toString(16).toUpperCase().padStart(4, '0')})`, L);
      }
      if (depth === 0 && toks.length && toks[toks.length - 1].t !== 'NEWLINE' && toks[toks.length - 1].t !== 'INDENT' && toks[toks.length - 1].t !== 'DEDENT') toks.push({ t: 'NEWLINE', line: L });
    }
    if (openStack.length) { const o = openStack[openStack.length - 1]; throw new PyError('SyntaxError', `'${o.op}' was never closed`, o.line); }
    const last = lines.length;
    if (toks.length && toks[toks.length - 1].t !== 'NEWLINE') toks.push({ t: 'NEWLINE', line: last });
    while (indents.length > 1) { indents.pop(); toks.push({ t: 'DEDENT', line: last }); }
    toks.push({ t: 'EOF', line: last });
    return toks;
  }
  function unescape(s) {
    return s.replace(/\\(n|t|r|\\|'|"|0|\n)/g, (m, c) => ({ n: '\n', t: '\t', r: '\r', '\\': '\\', "'": "'", '"': '"', '0': '\0', '\n': '' }[c]));
  }

  /* ---------- парсер ---------- */
  function parse(src) {
    const toks = tokenize(src);
    let p = 0;
    const peek = (o = 0) => toks[p + o];
    const at = (t, v) => { const k = toks[p]; return k.t === t && (v === undefined || k.v === v); };
    const eat = (t, v) => { if (at(t, v)) return toks[p++]; return null; };
    const syntax = (msg, line) => new PyError('SyntaxError', msg || 'invalid syntax', line || peek().line);
    const expect = (t, v, msg) => { const k = eat(t, v); if (!k) throw syntax(msg); return k; };

    function parseFile() {
      const body = [];
      while (!at('EOF')) {
        if (eat('NEWLINE')) continue;
        if (at('INDENT')) throw new PyError('IndentationError', 'unexpected indent', peek().line);
        body.push(...statement());
      }
      return body;
    }
    function block(kind, line) {
      if (eat('NEWLINE')) {
        if (!eat('INDENT')) throw new PyError('IndentationError', `expected an indented block after '${kind}' statement on line ${line}`, peek().line);
        const body = [];
        while (!eat('DEDENT')) {
          if (at('EOF')) break;
          if (eat('NEWLINE')) continue;
          if (at('INDENT')) throw new PyError('IndentationError', 'unexpected indent', peek().line);
          body.push(...statement());
        }
        return body;
      }
      return simpleLine();
    }
    function statement() {
      const k = peek();
      if (k.t === 'KW') {
        if (k.v === 'for') {
          p++;
          const tgt = expect('NAME', undefined, 'invalid syntax');
          let targets = [tgt.v];
          while (eat('OP', ',')) targets.push(expect('NAME').v);
          expect('KW', 'in', "invalid syntax");
          const iter = exprList();
          expect('OP', ':', "expected ':'");
          const body = block('for', k.line);
          let orelse = null;
          if (at('KW', 'else') ) { const e = toks[p++]; expect('OP', ':', "expected ':'"); orelse = block('else', e.line); }
          return [{ k: 'for', targets, iter, body, orelse, line: k.line }];
        }
        if (k.v === 'while') {
          p++;
          const test = expr();
          if (at('OP', '=')) throw syntax("invalid syntax. Maybe you meant '==' or ':=' instead of '='?");
          expect('OP', ':', "expected ':'");
          const body = block('while', k.line);
          return [{ k: 'while', test, body, line: k.line }];
        }
        if (k.v === 'if') {
          p++;
          const test = expr();
          if (at('OP', '=')) throw syntax("invalid syntax. Maybe you meant '==' or ':=' instead of '='?");
          expect('OP', ':', "expected ':'");
          const body = block('if', k.line);
          const node = { k: 'if', test, body, orelse: [], line: k.line };
          let cur = node;
          for (;;) {
            if (at('KW', 'elif')) {
              const e = toks[p++];
              const t2 = expr(); expect('OP', ':', "expected ':'");
              const n2 = { k: 'if', test: t2, body: block('elif', e.line), orelse: [], line: e.line };
              cur.orelse = [n2]; cur = n2; continue;
            }
            if (at('KW', 'else')) {
              const e = toks[p++];
              expect('OP', ':', "expected ':'");
              cur.orelse = block('else', e.line);
            }
            break;
          }
          return [node];
        }
        if (['def', 'class', 'try', 'with', 'lambda', 'return', 'from', 'global', 'raise', 'yield', 'assert', 'del'].includes(k.v)) {
          throw new PyError('Unsupported', `Конструкцію «${k.v}» цей навчальний тренажер ще не підтримує. Вона є у справжньому Python — спробуй її в IDLE чи Thonny.`, k.line);
        }
        if (k.v === 'elif' || k.v === 'else') throw syntax('invalid syntax');
      }
      return simpleLine();
    }
    function simpleLine() {
      const out = [simple()];
      while (eat('OP', ';')) { if (at('NEWLINE')) break; out.push(simple()); }
      if (!eat('NEWLINE')) {
        if (at('EOF')) return out;
        throw syntax();
      }
      return out;
    }
    function simple() {
      const k = peek();
      if (k.t === 'KW') {
        if (k.v === 'pass') { p++; return { k: 'pass', line: k.line }; }
        if (k.v === 'break') { p++; return { k: 'break', line: k.line }; }
        if (k.v === 'continue') { p++; return { k: 'continue', line: k.line }; }
        if (k.v === 'import') {
          p++;
          const names = [expect('NAME').v];
          while (eat('OP', ',')) names.push(expect('NAME').v);
          return { k: 'import', names, line: k.line };
        }
      }
      const first = exprList();
      if (at('OP', '=')) {
        const targets = [first];
        let value;
        while (eat('OP', '=')) { value = exprList(); targets.push(value); }
        value = targets.pop();
        for (const t of targets) checkTarget(t, k.line);
        return { k: 'assign', targets, value, line: k.line };
      }
      const aug = ['+=', '-=', '*=', '/=', '//=', '%=', '**='].find(o => at('OP', o));
      if (aug) {
        p++;
        checkTarget(first, k.line, true);
        return { k: 'aug', target: first, op: aug.slice(0, -1), value: exprList(), line: k.line };
      }
      if (at('OP', '==') ) throw syntax();
      return { k: 'expr', e: first, line: k.line };
    }
    function checkTarget(t, line, aug) {
      if (t.k === 'name' || t.k === 'sub') return;
      if (t.k === 'tuple' && !aug && t.items.every(x => x.k === 'name' || x.k === 'sub')) return;
      if (t.k === 'call') throw new PyError('SyntaxError', "cannot assign to function call here. Maybe you meant '==' instead of '='?", line);
      if (t.k === 'const') throw new PyError('SyntaxError', "cannot assign to literal here. Maybe you meant '==' instead of '='?", line);
      throw new PyError('SyntaxError', "cannot assign to expression here. Maybe you meant '==' instead of '='?", line);
    }
    function exprList() {
      const line = peek().line;
      const first = expr();
      if (!at('OP', ',')) return first;
      const items = [first];
      while (eat('OP', ',')) {
        if (at('NEWLINE') || at('OP', '=') || at('OP', ')') || at('OP', ':') || at('EOF')) break;
        items.push(expr());
      }
      return { k: 'tuple', items, line };
    }
    function expr() { return orExpr(); }
    function orExpr() {
      let l = andExpr();
      while (at('KW', 'or')) { const t = toks[p++]; l = { k: 'bool', op: 'or', l, r: andExpr(), line: t.line }; }
      return l;
    }
    function andExpr() {
      let l = notExpr();
      while (at('KW', 'and')) { const t = toks[p++]; l = { k: 'bool', op: 'and', l, r: notExpr(), line: t.line }; }
      return l;
    }
    function notExpr() {
      if (at('KW', 'not')) { const t = toks[p++]; return { k: 'not', e: notExpr(), line: t.line }; }
      return comparison();
    }
    const CMP = ['==', '!=', '<', '>', '<=', '>='];
    function comparison() {
      const first = arith();
      const ops = [], rest = [];
      for (;;) {
        if (peek().t === 'OP' && CMP.includes(peek().v)) { ops.push(toks[p++].v); rest.push(arith()); continue; }
        if (at('KW', 'in')) { p++; ops.push('in'); rest.push(arith()); continue; }
        if (at('KW', 'not') && peek(1).t === 'KW' && peek(1).v === 'in') { p += 2; ops.push('not in'); rest.push(arith()); continue; }
        if (at('KW', 'is')) { p++; if (eat('KW', 'not')) ops.push('is not'); else ops.push('is'); rest.push(arith()); continue; }
        break;
      }
      if (!ops.length) return first;
      return { k: 'cmp', first, ops, rest, line: first.line };
    }
    function arith() {
      let l = term();
      while (peek().t === 'OP' && (peek().v === '+' || peek().v === '-')) { const t = toks[p++]; l = { k: 'bin', op: t.v, l, r: term(), line: t.line }; }
      return l;
    }
    function term() {
      let l = unary();
      while (peek().t === 'OP' && ['*', '/', '//', '%'].includes(peek().v)) { const t = toks[p++]; l = { k: 'bin', op: t.v, l, r: unary(), line: t.line }; }
      return l;
    }
    function unary() {
      if (peek().t === 'OP' && (peek().v === '-' || peek().v === '+')) { const t = toks[p++]; return { k: 'unary', op: t.v, e: unary(), line: t.line }; }
      return power();
    }
    function power() {
      const base = postfix();
      if (at('OP', '**')) { const t = toks[p++]; return { k: 'bin', op: '**', l: base, r: unary(), line: t.line }; }
      return base;
    }
    function postfix() {
      let e = atom();
      for (;;) {
        if (at('OP', '(')) {
          const t = toks[p++];
          const args = [], kwargs = [];
          while (!at('OP', ')')) {
            if (peek().t === 'NAME' && peek(1).t === 'OP' && peek(1).v === '=') {
              const n = toks[p].v; p += 2; kwargs.push({ name: n, v: expr() });
            } else {
              if (kwargs.length) throw syntax('positional argument follows keyword argument');
              args.push(expr());
            }
            if (!eat('OP', ',')) break;
          }
          if (!eat('OP', ')')) {
            const k = peek();
            if (k.t === 'NUM' || k.t === 'STR' || k.t === 'NAME') throw syntax('invalid syntax. Perhaps you forgot a comma?', k.line);
            throw syntax();
          }
          e = { k: 'call', f: e, args, kwargs, line: t.line };
          continue;
        }

function stationSVG() {
  const W = 1200, H = 400, spineY = 190;
  const nx = nextIndex();
  let stars = '';
  let seed = 7;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < 70; i++) stars += `<circle cx="${(rnd() * W).toFixed(0)}" cy="${(rnd() * H).toFixed(0)}" r="${(rnd() * 1.4 + .4).toFixed(1)}" fill="#CFE0D6" opacity="${(rnd() * .5 + .2).toFixed(2)}"/>`;
  const frac = doneCount() / MISSIONS.length;
  const panel = (x, side) => {
    let s = `<rect x="${side === 'l' ? x + 36 : x - 4}" y="${spineY - 4}" width="12" height="28" fill="#3B5A4B"/>`;
    const cols = 3, rows = 4;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const idx = r * cols + c, lit = idx < Math.round(frac * rows * cols);
      const px = x + c * 12 - (side === 'l' ? 0 : 0), py = 80 + r * 64 + (r >= 2 ? 32 : 0);
      s += `<rect x="${px}" y="${py}" width="10" height="56" rx="1.5" fill="${lit ? '#E0A526' : '#28473A'}" stroke="#4A6E5D" stroke-width="1"/>`;
    }
    return s;
  };
  let mods = '';
  MISSIONS.forEach((m, i) => {
    const col = Math.floor(i / 2), top = i % 2 === 0;
    const x = 118 + col * 166, w = 136, hh = 96;
    const y = top ? spineY - 34 - hh : spineY + 54;
    const done = !!S.done[m.id], locked = !isUnlocked(i), next = i === nx && !locked;
    const cls = ['mod', done ? 'done' : '', locked ? 'locked' : '', next ? 'next' : '', justLit === m.id ? 'just-lit' : ''].join(' ');
    const fill = done ? '#2F7D5A' : '#20372D';
    const stroke = done ? '#7FCFA2' : '#3E5F50';
    const win = done ? '#F3D56B' : '#16291F';
    const neck = top ? `<rect x="${x + w / 2 - 9}" y="${y + hh}" width="18" height="${spineY - y - hh}" fill="#3B5A4B"/>` : `<rect x="${x + w / 2 - 9}" y="${spineY + 20}" width="18" height="${y - spineY - 20}" fill="#3B5A4B"/>`;
    const label = esc(m.name);
    const lblY = top ? y - 12 : y + hh + 26;
    mods += `<g class="${cls}" data-i="${i}" tabindex="${locked ? -1 : 0}" role="button" aria-label="Відсік ${i + 1}: ${label}${done ? ', відновлено' : locked ? ', закрито' : ''}">
      ${neck}
      <rect class="glow" x="${x - 10}" y="${y - 10}" width="${w + 20}" height="${hh + 20}" rx="22" fill="#F3D56B" opacity="${done ? .18 : 0}"/>
      <rect class="hull" x="${x}" y="${y}" width="${w}" height="${hh}" rx="16" fill="${fill}" stroke="${stroke}" stroke-width="2" ${locked ? 'stroke-dasharray="6 5"' : ''}/>
      <text class="num" x="${x + 16}" y="${y + 34}" fill="${done ? '#FFFFFF' : locked ? '#5E7D6E' : '#E8EFEA'}">${i + 1}</text>
      ${[0, 1, 2].map(k => `<circle cx="${x + 30 + k * 38}" cy="${y + 64}" r="11" fill="${win}" stroke="${done ? '#FFF3C4' : '#3E5F50'}" stroke-width="2"/>`).join('')}
      ${next ? `<circle class="beacon" cx="${x + w - 18}" cy="${y + 20}" r="6" fill="#E0A526"/>` : ''}
      ${done ? `<text x="${x + w - 14}" y="${y + 30}" text-anchor="end" font-size="16" fill="#F3D56B">${'★'.repeat(S.done[m.id].stars)}</text>` : ''}
      <text class="lbl" x="${x + w / 2}" y="${lblY}" text-anchor="middle" opacity="${locked ? .5 : 1}">${label}</text>
    </g>`;
  });
  return `<svg class="station" viewBox="0 0 ${W} ${H}" role="group" aria-label="Схема станції: відсіки">
    ${stars}
    ${panel(16, 'l')}${panel(W - 52, 'r')}
    <rect x="62" y="${spineY}" width="${W - 124}" height="20" rx="6" fill="#3B5A4B"/>
    <rect x="62" y="${spineY + 8}" width="${(W - 124) * frac}" height="4" rx="2" fill="#E0A526"/>
    ${mods}
  </svg>`;
}

/* ===== Редактор коду ===== */
const KW = new Set(['for', 'in', 'while', 'if', 'elif', 'else', 'break', 'continue', 'pass', 'import', 'and', 'or', 'not', 'True', 'False', 'None', 'def', 'return', 'is', 'from', 'as', 'class', 'lambda']);
const BI = new Set(['print', 'input', 'int', 'float', 'str', 'bool', 'type', 'range', 'len', 'abs', 'round', 'min', 'max', 'sum', 'list', 'sorted']);
function highlight(src) {
  const re = /(#.*$)|('(?:[^'\\\n]|\\.)*'?|"(?:[^"\\\n]|\\.)*"?)|(\b\d[\d_]*(?:\.\d*)?(?:[eE][+-]?\d+)?\b)|([\p{L}_][\p{L}\p{N}_]*)|([^\s\p{L}\p{N}_#'"]+)/gmu;
  let out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    const t = m[0];
    if (m[1]) out += `<span class="tk-com">${esc(t)}</span>`;
    else if (m[2]) out += `<span class="tk-str">${esc(t)}</span>`;
    else if (m[3]) out += `<span class="tk-num">${esc(t)}</span>`;
    else if (m[4]) out += (KW.has(t) || BI.has(t)) ? `<span class="tk-kw">${esc(t)}</span>` : esc(t);
    else out += `<span class="tk-op">${esc(t)}</span>`;
    last = m.index + t.length;
  }
  return out + esc(src.slice(last)) + '\n';
}
function makeEditor(container, value, onChange, onRun, opts = {}) {
  const ed = h(`<div class="editor ${opts.tall ? 'tall' : ''}">
    <div class="gutter" aria-hidden="true"></div>
